server:
  address: tcp://0.0.0.0:9091
  asset_path: /config/assets

log:
  level: info

authentication_backend:
  file:
    path: /config/users.yml

access_control:
  default_policy: deny
  rules:
    - domain: admin.nexovault.cc
      policy: one_factor

session:
  cookies:
    - domain: nexovault.cc
      authelia_url: https://auth.nexovault.cc
      default_redirection_url: https://test.nexovault.cc/dashboard/
storage:
  local:
    path: /data/db.sqlite3

notifier:
  filesystem:
    filename: /data/notification.txt

############################ CUSTOMISATION ############################
theme: dark


