authentication_backend:
  file:
    path: /config/users.yml

access_control:
  default_policy: deny
  rules:
    - domain: server.lab.home.arpa
      policy: one_factor
    - domain: test.nexovault.cc
      policy: one_factor

session:
  cookies:
    - domain: lab.home.arpa
      authelia_url: https://auth.lab.home.arpa
      default_redirection_url: https://server.lab.home.arpa/dashboard/

    - domain: nexovault.cc
      authelia_url: https://auth.nexovault.cc
      default_redirection_url: https://test.nexovault.cc/dashboard/
storage:
  local:
    path: /data/db.sqlite3

notifier:
  filesystem:
    filename: /data/notification.txt

############################ CUSTOMISATION ############################
theme: dark

server:
  asset_path: /config/assets
